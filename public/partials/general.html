<div class="admin-modal-backdrop" id="admin-login-overlay" hidden>
  <section class="admin-login-card" role="dialog" aria-modal="true" aria-labelledby="admin-login-title">
    <button class="admin-modal-close" id="close-admin" type="button" aria-label="Cerrar">×</button>
    <p class="eyebrow">PANEL DE CONTROL</p><h2 id="admin-login-title">Administración</h2>
    <p id="auth-description">Ingresa con el correo y la contraseña de una cuenta administradora. Las cuentas de cliente no pueden acceder al panel.</p>
    <small class="admin-login-help">Si aún no tienes una cuenta administradora, créala con <code>npm run create-admin</code> en la terminal del proyecto.</small>
    <div id="auth-logged-in" hidden>
      <p id="auth-welcome" role="status"></p>
      <button class="admin-secondary" id="auth-logout" type="button">Cerrar sesión</button>
    </div>
    <div id="auth-forms">
      <form class="admin-form" id="admin-login-form">
        <label>Correo electrónico<input name="email" type="email" autocomplete="username" required placeholder="tu@correo.com" /></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required placeholder="Contraseña" /></label>
        <p class="admin-error" id="login-error" role="alert" hidden></p>
        <button class="admin-primary" type="submit">Iniciar sesión</button>
      </form>
      <p id="auth-status" role="status" aria-live="polite"></p>
    </div>
  </section>
</div>
<template id="recommendation-template">
  <article class="recommendation-card">
    <figure class="recommendation-image"><img loading="lazy" /><span class="product-number"></span></figure>
    <div class="recommendation-copy">
      <small class="product-category"></small><h3 class="product-title"></h3><p class="product-description"></p>
      <p class="database-product-brand" hidden></p>
      <p class="database-product-price" hidden></p>
      <details class="product-details">
        <summary>Ver ficha educativa</summary>
        <div class="product-facts">
          <div><b>Contenido y características</b><p class="product-content"></p></div>
          <div><b>Modo de uso</b><p class="product-use"></p></div>
          <div class="product-pros-cons"><p><b>Ventajas</b><br /><span class="product-advantages"></span></p><p><b>A tener en cuenta</b><br /><span class="product-disadvantages"></span></p></div>
          <a class="product-official-link" target="_blank" rel="noreferrer">Consultar en la web oficial <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></a>
        </div>
      </details>
      <details class="database-product-details" hidden>
        <summary>Detalles del producto</summary>
        <div class="product-facts">
          <div><b>Tipo de piel</b><p class="database-product-skin"></p></div>
          <div><b>Ingredientes</b><p class="database-product-ingredients"></p></div>
          <div><b>Disponibilidad</b><p class="database-product-stock"></p></div>
        </div>
      </details>
    </div>
  </article>
</template>
